<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Exchange Operator Evaluation - Participant Information</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen relative flex items-center justify-center p-4 bg-cover bg-center bg-no-repeat overflow-hidden" style="background-image: url('background.png');">
    
    <!-- Dark overlay shade for page contrast -->
    <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-[2px]"></div>

    <!-- Wrapper -->
    <div class="relative z-10 flex flex-col items-center">
        
        <!-- Floating Logo Button with Pressed / Inset Debossed Effect -->
        <div id="floatingLogoBtn" class="cursor-pointer transition-all duration-300 hover:scale-105 bg-slate-100 p-6 rounded-full shadow-[0_15px_35px_rgba(0,0,0,0.6),inset_6px_6px_14px_rgba(163,177,198,0.8),inset_-6px_-6px_14px_rgba(255,255,255,1)] border border-slate-200/80 flex items-center justify-center" onclick="toggleForm()">
            <img src="image_0.png" alt="Data Exchange Logo" class="h-16 w-auto object-contain drop-shadow-sm">
        </div>
        <p id="clickHint" class="text-slate-200 text-xs font-semibold mt-3 tracking-wide drop-shadow-md">Click logo to start evaluation</p>

        <!-- Drop-down Card Container (Hidden initially) -->
        <div id="formCard" class="max-w-md w-full bg-[#eef2f6]/95 backdrop-blur-xl rounded-3xl shadow-2xl p-6 border border-white/60 max-h-0 overflow-hidden transition-all duration-700 ease-in-out opacity-0 scale-95 pointer-events-none">
            
            <!-- Header Inside Form -->
            <div class="text-center mb-5 border-b border-slate-300/60 pb-4">
                <div class="flex justify-center mb-2">
                    <img src="image_0.png" alt="Data Exchange Logo" class="h-10 w-auto object-contain drop-shadow-md">
                </div>
                <h1 class="text-lg font-extrabold text-slate-950">Data Exchange Operator</h1>
                <div class="mt-2 flex flex-col items-center gap-1">
                    <span class="text-[10px] font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-100/80 px-2.5 py-0.5 rounded-full">Step 1 of 4</span>
                    <h3 class="text-sm font-bold text-slate-800">Participant Information</h3>
                </div>
            </div>

            <!-- Form -->
            <form id="participantForm" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                    <input type="text" id="name" required 
                        class="w-full px-3.5 py-3 rounded-2xl border-0 bg-[#eef2f6] shadow-[inset_4px_4px_8px_#cbced1,inset_-4px_-4px_8px_#ffffff] focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all text-slate-800 text-sm placeholder-slate-400"
                        placeholder="John Doe">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
                    <input type="email" id="email" required 
                        class="w-full px-3.5 py-3 rounded-2xl border-0 bg-[#eef2f6] shadow-[inset_4px_4px_8px_#cbced1,inset_-4px_-4px_8px_#ffffff] focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all text-slate-800 text-sm placeholder-slate-400"
                        placeholder="john@example.com">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number</label>
                    <input type="tel" id="phone" required 
                        class="w-full px-3.5 py-3 rounded-2xl border-0 bg-[#eef2f6] shadow-[inset_4px_4px_8px_#cbced1,inset_-4px_-4px_8px_#ffffff] focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all text-slate-800 text-sm placeholder-slate-400"
                        placeholder="+1 (555) 000-0000">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Gender</label>
                        <select id="gender" required 
                            class="w-full px-3.5 py-3 rounded-2xl border-0 bg-[#eef2f6] shadow-[inset_4px_4px_8px_#cbced1,inset_-4px_-4px_8px_#ffffff] focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all text-slate-800 text-sm">
                            <option value="" disabled selected>Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Age</label>
                        <input type="number" id="age" required min="1" max="120" 
                            class="w-full px-3.5 py-3 rounded-2xl border-0 bg-[#eef2f6] shadow-[inset_4px_4px_8px_#cbced1,inset_-4px_-4px_8px_#ffffff] focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all text-slate-800 text-sm placeholder-slate-400"
                            placeholder="25">
                    </div>
                </div>

                <!-- Rich 3D Glossy Embossed Button -->
                <button type="submit" 
                    class="w-full mt-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 hover:from-blue-700 hover:via-indigo-700 hover:to-violet-700 text-white font-bold py-3.5 rounded-xl shadow-[0_8px_20px_rgba(79,70,229,0.5),inset_0_2px_3px_rgba(255,255,255,0.4),inset_0_-2px_3px_rgba(0,0,0,0.2)] active:translate-y-0.5 active:shadow-[0_3px_8px_rgba(79,70,229,0.4)] transition-all cursor-pointer text-sm border border-indigo-400/40 tracking-wide">
                    Proceed to Video Interview &rarr;
                </button>
            </form>
        </div>

    </div>

    <script>
        // Web Audio API Sound Effect for Dropdown
        function playDropdownSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sine';
                // Pitch bend effect (slides from low to high frequency for drop-down feel)
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);

                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function toggleForm() {
            playDropdownSound(); // Play sound effect on click

            const floatingLogoBtn = document.getElementById('floatingLogoBtn');
            const clickHint = document.getElementById('clickHint');
            const formCard = document.getElementById('formCard');

            floatingLogoBtn.style.transform = "scale(0)";
            floatingLogoBtn.style.opacity = "0";
            clickHint.style.opacity = "0";
            
            setTimeout(() => {
                floatingLogoBtn.style.display = "none";
                clickHint.style.display = "none";
            }, 300);

            formCard.style.maxHeight = "700px";
            formCard.style.opacity = "1";
            formCard.style.scale = "1";
            formCard.style.pointerEvents = "auto";
        }

        const participantData = {};

        document.getElementById('participantForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            participantData.name = document.getElementById('name').value.trim();
            participantData.email = document.getElementById('email').value.trim();
            participantData.phone = document.getElementById('phone').value.trim();
            participantData.gender = document.getElementById('gender').value;
            participantData.age = document.getElementById('age').value;
            sessionStorage.setItem('participant', JSON.stringify(participantData));
            window.location.href = 'interview.html';
        });
    </script>
</body>
</html>
