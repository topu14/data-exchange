<script>
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwN_GTspp0wGzKwyGuWxnCAQ6W_AgQ_fTccL5lBDOlnrxth2pu_6Cb4biZSodkM82JPog/exec";

        // ... [keep your setup code as is] ...

        function stopAndSubmitTest() {
            isTestActive = false;
            if (recognition) {
                recognition.stop();
            }

            micStatusEl.innerText = "Processing results...";
            stopBtn.disabled = true;

            const sourceWords = sourceTextEl.innerText.trim().toLowerCase().replace(/[^\w\s]/gi, '').split(/\s+/);
            const spokenWords = speechFeedEl.innerText.trim().toLowerCase().replace(/[^\w\s]/gi, '').split(/\s+/);

            let matchedWords = 0;
            const spokenSet = new Set(spokenWords);
            
            sourceWords.forEach(word => {
                if (spokenSet.has(word)) {
                    matchedWords++;
                }
            });

            let rawAccuracy = sourceWords.length > 0 && spokenWords.length > 0 && spokenWords[0] !== "" 
                ? (matchedWords / sourceWords.length) * 100 
                : 0;

            let readingAccuracy = Math.min(100, Math.round(rawAccuracy * 1.15));

            let participantData = JSON.parse(sessionStorage.getItem('participant')) || {};
            participantData.readingAccuracy = readingAccuracy + '%';
            participantData.timestamp = new Date().toISOString();

            // FIXED: Compare against the placeholder string so your actual URL triggers the fetch
            if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
                fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(participantData)
                }).catch(err => console.error("Error submitting to sheet:", err));
            }

            testContainer.classList.add('hidden');
            thankYouScreen.classList.remove('hidden');
        }
    </script>
